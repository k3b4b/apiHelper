<!DOCTYPE html>
<html>
<head>
    <title>API Helper by k3b4b</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>API Helper by k3b4b</h1>

<h2>Добавить новый API ключ</h2>
<form method="post" action="/api/add_api_key">
    <label>API ключ:</label><br>
    <input type="text" name="api_key" required><br>
    <label>Описание:</label><br>
    <input type="text" name="description"><br><br>
    <button type="submit">Добавить</button>
</form>

<h2>Выбор API ключа</h2>
<div class="controls">
    <select id="api-key-select">
        {% for key in api_keys %}
            <option value="{{ key.id }}">{{ key.description }}</option>
        {% endfor %}
    </select>
    <button onclick="fetchOrganizations(document.getElementById('api-key-select').value)">
        Получить организации
    </button>
</div>

<h2>Организации</h2>
<table border="1" id="org-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Выбрать</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<!-- Вкладки + кнопка обновления -->
<div class="tabs" id="tabs-container" style="display:flex; align-items:center;">
    <div style="display:flex; gap:5px;">
        <button class="tab-button" data-type="terminals">Терминалы</button>
        <button class="tab-button" data-type="payment_types">Типы оплат</button>
        <button class="tab-button" data-type="order_types">Типы заказов</button>
        <button class="tab-button" data-type="discounts">Скидки</button>
        <button class="tab-button" data-type="nomenclature">Номенклатура</button>
    </div>
    <button id="refresh-all-btn" style="margin-left:auto;">Обновить все данные</button>
</div>

<!-- Вторая таблица -->
<table border="1" id="details-table" style="display:none;">
    <thead>
        <tr></tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
let isFetching = false;

async function fetchOrganizations(keyId) {
    const response = await fetch(`/api/get_organizations/${keyId}`);
    if (!response.ok) {
        alert("Ошибка при получении организаций");
        return;
    }
    const data = await response.json();
    const tbody = document.querySelector("#org-table tbody");
    tbody.innerHTML = "";

    data.forEach(org => {
        const safeName = org.name.replace(/'/g, "\\'");
        const tr = document.createElement("tr");

        tr.dataset.orgId = org.internal_id;
        
        tr.innerHTML = `
            <td>${org.id}</td>
            <td>${org.name}</td>
            <td><button onclick="selectOrganization(this)">Выбрать</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function selectOrganization(button) {
    const tr = button.closest("tr");
    const orgId = parseInt(tr.dataset.orgId, 10); // internal_id для запросов
    const orgName = tr.querySelector("td").textContent;

    // Снимаем выделение со всех строк
    document.querySelectorAll("#org-table tbody tr").forEach(r => r.classList.remove("selected-row"));
    tr.classList.add("selected-row");


    // Показываем вкладки и вторую таблицу
    const tabsContainer = document.getElementById("tabs-container");
    tabsContainer.style.display = "flex";

    const detailsTable = document.getElementById("details-table");
    detailsTable.style.display = "table";
    detailsTable.dataset.orgId = orgId;

    // Очищаем предыдущие данные таблицы
    detailsTable.querySelector("thead tr").innerHTML = "";
    detailsTable.querySelector("tbody").innerHTML = "";
}

// Обработчик кнопки "Обновить все данные"
document.getElementById("refresh-all-btn").addEventListener("click", async () => {
    const detailsTable = document.getElementById("details-table");
    const orgIdStr = detailsTable.dataset.orgId;

    if (!orgIdStr) {
        alert("Сначала выберите организацию!");
        return;
    }

    const orgId = parseInt(orgIdStr, 10);

    if (isNaN(orgId)) {
        alert("Неверный ID организации!");
        return;
    }

    const keyId = document.getElementById("api-key-select").value;
    if (!keyId) {
        alert("API ключ не выбран!");
        return;
    }

    if (isFetching) return;
    isFetching = true;

    try {
        const response = await fetch(`/api/refresh_all/${keyId}/${orgId}`, {
            method: "POST"
        });

        if (!response.ok) {
            alert("Ошибка при обновлении данных");
            return;
        }

        const data = await response.json();
        alert("Данные успешно обновлены!");
        console.log(data);
    } catch (error) {
        console.error(error);
        alert("Произошла ошибка при запросе");
    } finally {
        isFetching = false;
    }
});

// Обработчик для вкладок
document.querySelectorAll(".tab-button").forEach(btn => {
    btn.addEventListener("click", async () => {
        const orgId = parseInt(document.getElementById("details-table").dataset.orgId, 10);
        const type = btn.dataset.type;

        const detailsTable = document.getElementById("details-table");
        const thead = detailsTable.querySelector("thead tr");
        const tbody = detailsTable.querySelector("tbody");

        tbody.innerHTML = "";
        thead.innerHTML = "";

        // Убираем класс active у всех кнопок
        document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));
        // Добавляем active к нажатой кнопке
        btn.classList.add("active");

        let data = [];

        try {
            switch (type) {
                case "terminals":
                    {
                        const response = await fetch(`/api/get_terminals/${orgId}`, { method: "POST" });
                        if (!response.ok) throw new Error("Ошибка при получении терминалов");
                        data = await response.json();
                        thead.innerHTML = "<th>ID</th><th>Название</th>";
                        data.forEach(t => {
                            const tr = document.createElement("tr");
                            tr.innerHTML = `<td>${t.terminal_id}</td><td>${t.name}</td>`;
                            tbody.appendChild(tr);
                        });
                    }
                    break;

                case "payment_types":
                    {
                        const response = await fetch(`/api/get_payment_types/${orgId}`, { method: "POST" });
                        if (!response.ok) throw new Error("Ошибка при получении способов оплаты");
                        data = await response.json();
                        thead.innerHTML = "<th>ID</th><th>Название</th>";
                        data.forEach(p => {
                            const tr = document.createElement("tr");
                            tr.innerHTML = `<td>${p.payment_type_id}</td><td>${p.name}</td>`;
                            tbody.appendChild(tr);
                        });
                    }
                    break;

                case "order_types":
                    {
                        const response = await fetch(`/api/get_order_types/${orgId}`, { method: "POST" });
                        if (!response.ok) throw new Error("Ошибка при получении типов заказов");
                        data = await response.json();
                        thead.innerHTML = "<th>ID</th><th>Название</th>";
                        data.forEach(o => {
                            const tr = document.createElement("tr");
                            tr.innerHTML = `<td>${o.order_type_id}</td><td>${o.name}</td>`;
                            tbody.appendChild(tr);
                        });
                    }
                    break;

                case "discounts":
                    {
                        const response = await fetch(`/api/get_discount_types/${orgId}`, { method: "POST" });
                        if (!response.ok) throw new Error("Ошибка при получении скидок");
                        data = await response.json();
                        thead.innerHTML = "<th>ID</th><th>Название</th>";
                        data.forEach(d => {
                            const tr = document.createElement("tr");
                            tr.innerHTML = `<td>${d.discount_type_id}</td><td>${d.name}</td>`;
                            tbody.appendChild(tr);
                        });
                    }
                    break;

                default:
                    console.warn("Неизвестный тип вкладки:", type);
            }
        } catch (err) {
            alert(err.message);
            console.error(err);
        }
    });
});

</script>
</body>
</html>
